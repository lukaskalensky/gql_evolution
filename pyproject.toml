[project]
name = 'event-boilerplate-project'
version = '0.1.0'
description = 'Event/EventInvitation boilerplate for Strawberry GraphQL federation using uoishelpers'
requires-python = '>=3.12'
dependencies = [
  'strawberry-graphql',
  'sqlalchemy',
  'asyncpg',
  'greenlet',
  'uoishelpers @ https://github.com/hrbolek/uoishelpers/archive/4e41615436d6effbe248d8503e4df373549bcec3.zip',
]

[tool.pytest.ini_options]
testpaths = ['tests']
pythonpath = ['.']
