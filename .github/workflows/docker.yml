name: docker
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
        variant: ['bookworm', 'trixie', 'slim-bookworm', 'slim-trixie']
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            PYTHON_VERSION=${{ matrix.python-version }}
            PYTHON_VARIANT=${{ matrix.variant }}
          tags: event-boilerplate:${{ matrix.python-version }}-${{ matrix.variant }}
